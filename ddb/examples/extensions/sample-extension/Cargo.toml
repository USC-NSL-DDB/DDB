[package]
name = "ddb-sample-extension"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Out-of-tree style sample provider for the DDB extension API"

[dependencies]
async-trait = "0.1.85"
ddb-api-extension = { path = "../../../api-extension" }
ddb-api-types = { path = "../../../api-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
