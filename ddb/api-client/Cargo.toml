[package]
name = "ddb-api-client"
version = "0.1.0"
edition = "2021"
description = "Typed public Rust client for DDB API v2 frontends"
license = "Apache-2.0"
repository = "https://github.com/USC-NSL-DDB/DDB"
homepage = "https://github.com/USC-NSL-DDB/DDB"
documentation = "https://docs.rs/ddb-api-client"
readme = "README.md"
keywords = ["debugger", "distributed", "client", "api"]
categories = ["development-tools::debugging", "api-bindings"]

[dependencies]
bytes = "1.9"
ddb-api-types = { version = "0.1.0", path = "../api-types" }
futures-util = "0.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
axum = "0.7.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
