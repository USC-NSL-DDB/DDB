[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddb-api-client"
version = "0.1.0"
description = "Typed standard-library client for DDB API v2 frontends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DDB contributors" }]
keywords = ["debugger", "distributed", "ddb", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/USC-NSL-DDB/DDB"
Repository = "https://github.com/USC-NSL-DDB/DDB"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ddb_api = ["py.typed"]
