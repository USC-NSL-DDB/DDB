---
Framework: nu

Conf:
  sudo: true
  on_exit: "kill"

PrerunGdbCommands:
- name: "disable CALADAN's custom signal handling"
  command: "handle SIGUSR1 SIGUSR2 nostop noprint"

PostrunGdbCommands:
- name: "run auto-break-resume script"
  command: "source /proj/flashburst-PG0/code/distributed-debugger/rpc_frameworks/Nu/auto.gdb"
# No auto `-exec-continue`: it races DDB's post-attach `signal SIG40` handshake
# and can leave the process parked in sigwait. Resume manually once attached.

ServiceDiscovery:
  Broker:
    hostname: 10.10.2.12
