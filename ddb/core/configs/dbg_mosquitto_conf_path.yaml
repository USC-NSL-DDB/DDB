---
# Replace config_path with your Mosquitto configuration's absolute path.
# It must listen on port 10101 and must not enable daemon mode.
# Omit config_path to let DDB generate its managed broker configuration.

ServiceDiscovery:
  Broker:
    hostname: 127.0.0.1
    port: 10101
    managed:
      type: mosquitto
      config_path: /absolute/path/to/mosquitto.conf
    max_timeout_secs: 60

Conf:
  on_exit: kill
