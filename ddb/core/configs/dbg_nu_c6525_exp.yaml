---
Framework: nu

Conf:
  sudo: true
  on_exit: "kill"

PrerunGdbCommands:
- name: "disable CALADAN's custom signal handling"
  command: "handle SIGUSR1 SIGUSR2 nostop noprint"

# Do NOT auto-continue here. After attaching, DDB sends `signal SIG40`, which
# releases the connector's wait_for_debugger() and re-traps via SIGTRAP. A
# PostrunGdbCommands `-exec-continue` races that handshake and can leave the
# process parked in sigwait. Resume it yourself once attached:  -exec-continue

ServiceDiscovery:
  Broker:
    hostname: 10.10.2.12
