apiVersion: v1
kind: Pod
metadata:
  name: sw-socialnet-call-depth-ssh-gateway
  labels:
    app: sw-socialnet-call-depth-ssh-gateway
    ddb-artifact: sw-socialnet-call-depth
spec:
  containers:
    - name: gateway
      image: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
      ports:
        - containerPort: 2222
      command:
        - /bin/bash
        - -c
        - |
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server &&
          mkdir -p /run/sshd &&
          printf '%s\n' \
            'AllowTcpForwarding yes' \
            'GatewayPorts yes' \
            'PermitRootLogin yes' \
            'PasswordAuthentication yes' \
            'Port 2222' >> /etc/ssh/sshd_config &&
          echo 'root:password123' | chpasswd &&
          exec /usr/sbin/sshd -D -e
      resources:
        requests:
          cpu: "1"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "256Mi"
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: sw-socialnet-call-depth-ssh-gateway
  labels:
    ddb-artifact: sw-socialnet-call-depth
spec:
  type: ClusterIP
  ports:
    - name: ssh
      port: 2222
      targetPort: 2222
  selector:
    app: sw-socialnet-call-depth-ssh-gateway
