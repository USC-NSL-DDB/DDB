name: DDB API Documentation

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'ddb/docs-site/**'
      - 'ddb/docs/api/**'
      - 'ddb/proto/ddb/api/v2/**'
      - 'ddb/tools/api-codegen/**'
      - '.github/workflows/api-docs-pages.yml'
  pull_request:
    paths:
      - 'ddb/docs-site/**'
      - 'ddb/docs/api/**'
      - 'ddb/proto/ddb/api/v2/**'
      - 'ddb/tools/api-codegen/**'
      - '.github/workflows/api-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddb-api-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build API references
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            ddb/docs-site/package-lock.json
            ddb/docs-site/redoc-runtime/package-lock.json

      - name: Install locked documentation dependencies
        working-directory: ddb/docs-site
        run: npm ci --ignore-scripts

      - name: Install isolated Redoc runtime
        working-directory: ddb/docs-site/redoc-runtime
        run: npm ci --ignore-scripts

      - name: Validate source contracts
        working-directory: ddb/docs-site
        run: npm run check

      - name: Build static references
        working-directory: ddb/docs-site
        run: npm run build

      - name: Test Pages artifact
        working-directory: ddb/docs-site
        run: npm test

      - name: Upload Pages artifact
        if: >-
          github.event_name != 'pull_request' &&
          github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ddb/docs-site/dist

  deploy:
    name: Deploy API references
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
