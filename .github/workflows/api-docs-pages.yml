name: DDB API Documentation

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'ddb/docs-site/**'
      - 'ddb/docs/api/**'
      - 'ddb/proto/ddb/api/v2/**'
      - 'ddb/api-types/descriptor/**'
      - 'ddb/api-client/README.md'
      - 'ddb/sdk/typescript/README.md'
      - 'ddb/sdk/python/README.md'
      - 'ddb/buf.yaml'
      - 'ddb/tools/api-codegen/**'
      - '.github/workflows/api-docs-pages.yml'
  pull_request:
    paths:
      - 'ddb/docs-site/**'
      - 'ddb/docs/api/**'
      - 'ddb/proto/ddb/api/v2/**'
      - 'ddb/api-types/descriptor/**'
      - 'ddb/api-client/README.md'
      - 'ddb/sdk/typescript/README.md'
      - 'ddb/sdk/python/README.md'
      - 'ddb/buf.yaml'
      - 'ddb/tools/api-codegen/**'
      - '.github/workflows/api-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddb-api-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build API references
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'ddb/docs-site/.node-version'
          cache: npm
          cache-dependency-path: |
            ddb/docs-site/package-lock.json
            ddb/docs-site/redoc-runtime/package-lock.json
            ddb/docs-site/asyncapi-runtime/package-lock.json

      - name: Install locked documentation dependencies
        working-directory: ddb/docs-site
        run: npm ci --ignore-scripts

      - name: Install isolated Redoc runtime
        working-directory: ddb/docs-site/redoc-runtime
        run: npm ci --ignore-scripts

      - name: Install isolated AsyncAPI renderer
        working-directory: ddb/docs-site/asyncapi-runtime
        run: npm ci --ignore-scripts

      - name: Validate source contracts
        working-directory: ddb/docs-site
        run: npm run check

      - name: Build static references
        working-directory: ddb/docs-site
        run: npm run build

      - name: Test Pages artifact
        working-directory: ddb/docs-site
        run: npm test

      - name: Upload Pages artifact
        if: >-
          github.event_name != 'pull_request' &&
          github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ddb/docs-site/dist

  deploy:
    name: Deploy API references
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
