name: DDB API fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [protobuf_contract, protojson_contract]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Protobuf build dependencies
        timeout-minutes: 5
        run: bash ddb/tools/install-ci-packages.sh protobuf-compiler libprotobuf-dev

      - name: Install nightly Rust
        id: rust-toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly
          cache: false

      - name: Cache Rust fuzzing artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ddb/target/
            ddb/fuzz/target/
          key: rust-fuzz-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('ddb/**/Cargo.toml') }}
          restore-keys: |
            rust-fuzz-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz bounded public decoders
        working-directory: ddb
        run: >-
          cargo +nightly fuzz run --fuzz-dir fuzz ${{ matrix.target }} --
          -max_len=1048576 -max_total_time=60
