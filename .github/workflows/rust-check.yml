name: DDB Core Compilation Check

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'ddb/**/*.rs'
      - 'ddb/**/Cargo.toml'
      - 'ddb/**/Cargo.lock'
      - '.github/workflows/rust-check.yml'
  pull_request:
    paths:
      - 'ddb/**/*.rs'
      - 'ddb/**/Cargo.toml'
      - 'ddb/**/Cargo.lock'
      - '.github/workflows/rust-check.yml'
  workflow_dispatch:

jobs:
  check:
    name: DDB Core Compilation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      
      - name: Check formatting
        working-directory: ddb
        run: cargo fmt --all -- --check

      - name: Check every target and feature
        working-directory: ddb
        run: cargo check --workspace --all-targets --all-features

      - name: Lint DDB targets
        working-directory: ddb
        run: cargo clippy -p ddb --all-targets --all-features --no-deps -- -D warnings
      
      - name: Run workspace tests
        working-directory: ddb
        run: cargo test --workspace --all-targets

      - name: Run DDB all-feature tests
        working-directory: ddb
        run: cargo test -p ddb --all-targets --all-features
