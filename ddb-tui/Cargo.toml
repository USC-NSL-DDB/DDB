[package]
name = "ddb-tui"
version = "0.1.0"
edition = "2021"
description = "Modern terminal debugger frontend for DDB"
license = "Apache-2.0"

# Keep this application independently releasable from DDB's backend workspace.
[workspace]

[dependencies]
ddb-config = { path = "../ddb/config" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
ddb-api-client = { path = "../ddb/api-client" }
ddb-source-workspace = { path = "../ddb/source-workspace" }
futures-util = "0.3"
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
axum = "0.7.9"
ddb-api-extension = { path = "../ddb/api-extension" }
ddb-sample-extension = { path = "../ddb/examples/extensions/sample-extension" }
pretty_assertions = "1.4"
vt100 = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
